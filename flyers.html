<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>海报 Posters | Natural Place Rehab Centre</title>
        <link href="css/home.css" rel="stylesheet"/>
        <link href="css/style.css" rel="stylesheet"/>
        <style>
            .content-list {
                min-width: 0;
            }
            .poster-grid {
                width: 100%;
                min-width: 0;
                display: grid;
                grid-template-columns: repeat(8, 1fr);
                gap: 1rem;
                align-items: start;
            }
            @media (max-width: 1024px) {
                .poster-grid {
                    grid-template-columns: repeat(6, 1fr);
                }
            }
            @media (max-width: 768px) {
                .poster-grid {
                    grid-template-columns: repeat(4, 1fr);
                    gap: 1rem;
                }
            }
            .poster-grid figure {
                margin: 0;
                min-width: 0;
                text-align: center;
                cursor: zoom-in;
            }
            .poster-grid img {
                width: 100%;
                max-width: 100%;
                height: auto;
                display: block;
            }
            .poster-grid figcaption {
                margin-top: 0.5rem;
                font-size: 0.85rem;
            }
            .poster-grid figcaption.content-text {
                width: 100%;
                max-width: 100%;
                text-align: center;
                margin-bottom: 0;
            }
            .lightbox {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.85);
                z-index: 1000;
                align-items: center;
                justify-content: center;
                cursor: zoom-out;
            }
            .lightbox.open {
                display: flex;
            }
            .lightbox img {
                max-width: 92vw;
                max-height: 92vh;
                width: auto;
                height: auto;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <picture>
                <source media="(max-width: 768px)" srcset="images/logosmall.png">
                <img class="logo" src="images/logo.png" alt="Logo">
            </picture>
            <div class="nav-right">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="services.html">Services</a>
                <a class="nav-link" href="index-zh.html">中文</a>
                <a class="header-book-button" href="https://naturalplacerehab.janeapp.com/">
                    Book<span class="desktop-text"> Now </span>→
                </a>
            </div>
        </div>
        <div class="content-div">
            <div class="content-header">
                <h2 class="content-title">海报 Posters</h2>
            </div>
            <div class="content-list">
                <div class="poster-grid">
                    <figure>
                        <img src="images/flyers/bodyshape-1.png" alt="体型管理 Body Shape Management" data-full="images/flyers/bodyshape-1.png">
                        <figcaption class="content-text">体型管理 Body Shape Management</figcaption>
                    </figure>
                    <figure>
                        <img src="images/flyers/insomnia-1.png" alt="失眠 Insomnia" data-full="images/flyers/insomnia-1.png">
                        <figcaption class="content-text">失眠 Insomnia</figcaption>
                    </figure>
                    <figure>
                        <img src="images/flyers/stress-1.png" alt="压力焦虑 Stress & Anxiety" data-full="images/flyers/stress-1.png">
                        <figcaption class="content-text">压力焦虑 Stress &amp; Anxiety</figcaption>
                    </figure>
                    <figure>
                        <img src="images/flyers/pain-1.png" alt="疼痛管理 Pain Management" data-full="images/flyers/pain-1.png">
                        <figcaption class="content-text">疼痛管理 Pain Management</figcaption>
                    </figure>
                    <figure>
                        <img src="images/flyers/taichi-zh-1.png" alt="陈式功夫太极 Chen-Style Kung Fu Tai Chi" data-full="images/flyers/taichi-zh-1.png">
                        <figcaption class="content-text">陈式功夫太极 Chen-Style Kung Fu Tai Chi</figcaption>
                    </figure>
                    <figure>
                        <img src="images/flyers/taichi-en-1.png" alt="Chen-Style Kung Fu Tai Chi" data-full="images/flyers/taichi-en-1.png">
                        <figcaption class="content-text">Chen-Style Kung Fu Tai Chi</figcaption>
                    </figure>
                    <figure>
                        <img src="images/flyers/menopause-1.png" alt="更年期调理 Women's Wellness" data-full="images/flyers/menopause-1.png">
                        <figcaption class="content-text">更年期调理 Women's Wellness</figcaption>
                    </figure>
                    <figure>
                        <img src="images/flyers/tmj-1.png" alt="颞下颌关节紊乱 TMJ Disorder" data-full="images/flyers/tmj-1.png">
                        <figcaption class="content-text">颞下颌关节紊乱 TMJ Disorder</figcaption>
                    </figure>
                </div>
                <p class="content-text">点击海报可放大查看。更多海报陆续更新中。More posters coming soon.</p>
            </div>
        </div>
        <div class="footer">
            <div class="info">
                <h6>地址 Address</h6>
                <p>333 Denison St, Unit 20, Markham ON</p>
                <p>L3R 2Z4</p>
                <h6>电话 Phone</h6>
                <p>+1(905)475-7673</p>
                <p>+1(416)889-9872</p>
            </div>
        </div>
        <div class="lightbox" id="lightbox">
            <img id="lightbox-img" src="" alt="">
        </div>
        <script>
            (function () {
                var box = document.getElementById('lightbox');
                var img = document.getElementById('lightbox-img');
                var thumbs = document.querySelectorAll('.poster-grid img');
                thumbs.forEach(function (t) {
                    t.addEventListener('click', function () {
                        img.src = t.getAttribute('data-full');
                        img.alt = t.alt;
                        box.classList.add('open');
                    });
                });
                box.addEventListener('click', function () {
                    box.classList.remove('open');
                    img.src = '';
                });
            })();
        </script>
    </body>
</html>
